; HearMe firmware - PlatformIO project (ESP32-C3, Arduino-ESP32 2.x core)
;
;   pio run -e vehicle_beacon -t upload     ; vehicle beacon
;   pio run -e wristband -t upload          ; pedestrian wristband (BLE scanner + haptics)
;   pio run -e wristband_wokwi              ; wristband for Wokwi (serial packet injection, no BLE)
;   pio test -e native                      ; host unit tests (Unity)
;
; The packet codec lives in ../protocol/c/hearme_packet.h (single source of truth,
; shared with the codec tests); the receiver core is lib/hearme_receiver.

[platformio]
default_envs = wristband

[env]
build_flags =
    -I../protocol/c   ; relative to the project dir (no ${PROJECT_DIR}: breaks on paths with spaces)
    -ffp-contract=off           ; identical double rounding to the Python reference

[esp32c3]
platform = espressif32@^6.9.0   ; ships Arduino-ESP32 core 2.0.x (ledcSetup/ledcAttachPin API)
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    h2zero/NimBLE-Arduino@~1.4.3

; ---------------------------------------------------------------- vehicle beacon
[env:vehicle_beacon]
extends = esp32c3
build_src_filter = +<vehicle_beacon/>
lib_deps =
    ${esp32c3.lib_deps}
    mikalhart/TinyGPSPlus@^1.1.0
build_flags =
    ${env.build_flags}
    ; GPS uses UART1 on GPIO20/21, which are UART0's default pins on the C3, so the
    ; console goes to the native USB-Serial/JTAG port (GPIO18/19) instead.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- per-vehicle configuration (override in an extra env or with PLATFORMIO_BUILD_FLAGS)
    -DHEARME_VEHICLE_TYPE=HM_E_BIKE           ; HM_E_BIKE, HM_E_SCOOTER, HM_TUK_TUK, HM_CAR, HM_BUS, HM_MOTORCYCLE
    -DHEARME_FLEET_KEY_HEX=\"4865617224d650a1c3e79f0b8a2d5e6f1b3c4d5e6f708192a3b4c5d6e7f80910\"  ; TEST key
    ; -DHEARME_DEVICE_SECRET=\"bike-001\"     ; default: derived from the chip's eFuse MAC
    ; -DHEARME_BUS_ROUTE=\"12\"
    ; -DHEARME_BUS_DOOR=HM_DOOR_FRONT
    -DHEARME_TX_POWER=ESP_PWR_LVL_P9          ; +9 dBm
    -DHEARME_IGNITION_SENSE=1                 ; GPIO3, active high (100k series, 100k pull-down, 3.3 V zener)
    -DHEARME_IGN_PULLUP=0                     ; 1 = bench use with GPIO3 unwired (internal pull-up -> "on")
    -DHEARME_LED_RGB=1                        ; DevKitM-1 GPIO8 is a WS2812 RGB LED

; example: a bus beacon
[env:vehicle_beacon_bus]
extends = env:vehicle_beacon
build_unflags = -DHEARME_VEHICLE_TYPE=HM_E_BIKE
build_flags =
    ${env:vehicle_beacon.build_flags}
    -DHEARME_VEHICLE_TYPE=HM_BUS
    -DHEARME_BUS_ROUTE=\"12\"
    -DHEARME_BUS_DOOR=HM_DOOR_FRONT

; ---------------------------------------------------------------- wristband
[env:wristband]
extends = esp32c3
build_src_filter = +<wristband/>
build_flags =
    ${env.build_flags}
    -DHEARME_FLEET_KEY_HEX=\"4865617224d650a1c3e79f0b8a2d5e6f1b3c4d5e6f708192a3b4c5d6e7f80910\"
    -DHEARME_REQUIRE_MAC=0                    ; fail-safe: unverified vehicles still warn
    -DHEARME_LED_RGB=1

[env:wristband_wokwi]
extends = esp32c3
build_src_filter = +<wristband/>
lib_deps =                                     ; no BLE stack: Wokwi does not simulate BLE
lib_ignore = NimBLE-Arduino
build_flags =
    ${env.build_flags}
    -DHEARME_WOKWI=1
    -DHEARME_FLEET_KEY_HEX=\"4865617224d650a1c3e79f0b8a2d5e6f1b3c4d5e6f708192a3b4c5d6e7f80910\"
    -DHEARME_REQUIRE_MAC=0
    -DHEARME_LED_RGB=0                        ; plain LED on GPIO8 in diagram.json

; ---------------------------------------------------------------- host tests
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -I../protocol/c/test
    -std=gnu99
    -lm
